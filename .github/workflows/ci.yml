# Integración continua de ZeroHaus: en cada push y pull request a main se
# compila la app, se pasan todos los tests y se valida el backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App Android (compilación y tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios (algoritmo, traducciones, especialidades, estadísticas)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  reglas:
    name: Reglas de Firestore (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - name: Instalar Firebase CLI y dependencias
        working-directory: rules-tests
        run: |
          npm install -g firebase-tools
          npm ci

      - name: Tests de reglas
        working-directory: rules-tests
        run: npm test

  backend:
    name: Cloud Functions y textos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: functions/requirements.txt

      - name: Instalar dependencias
        run: pip install -r functions/requirements.txt

      - name: El módulo de funciones carga sin errores
        working-directory: functions
        env:
          # Valores ficticios: solo para poder importar el módulo
          SMTP_USUARIO: ci@example.com
          SMTP_CLAVE: ci
        run: python -c "import main; print('main.py OK')"

      - name: Los 14 idiomas están completos
        run: python herramientas/i18n.py comprobar
