# Actualizaciones automáticas de dependencias: como mucho un PR al mes por
# ecosistema, con todas sus actualizaciones juntas. Cada PR pasa por la CI
# (ci.yml), que compila la app, ejecuta los tests y valida el backend.
version: 2
updates:
  # App Android: plugins (gradle/libs.versions.toml) y librerías (app/build.gradle.kts)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build(deps)
    groups:
      android:
        patterns: ["*"]

  # Cloud Functions (Python). requirements.txt usa rangos ">=": solo se
  # propone un cambio si una versión nueva queda fuera del rango.
  - package-ecosystem: pip
    directory: /functions
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: build(deps)
    groups:
      functions:
        patterns: ["*"]

  # Tests de reglas de Firestore
  - package-ecosystem: npm
    directory: /rules-tests
    schedule:
      interval: monthly
    commit-message:
      prefix: build(deps)
    groups:
      rules-tests:
        patterns: ["*"]

  # Acciones de la CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
