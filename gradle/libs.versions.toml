# Solo las versiones de los plugins de Gradle (build.gradle.kts raíz).
# Las dependencias de la app están declaradas en app/build.gradle.kts.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
